<div class="overflow-hidden rounded-xl border bg-white"><div class="overflow-x-auto"><table class="min-w-full text-left text-sm"><thead class="bg-slate-100 text-xs uppercase text-slate-600"><tr>{% for column in columns %}<th class="whitespace-nowrap px-4 py-3">{{ column }}</th>{% endfor %}</tr></thead><tbody class="divide-y">{% for row in rows %}<tr class="hover:bg-blue-50/50">{% for key,value in row.items %}<td class="max-w-xs truncate whitespace-nowrap px-4 py-3 text-slate-700">{{ value }}</td>{% endfor %}</tr>{% empty %}<tr><td colspan="99" class="px-4 py-8 text-center text-slate-500">Nenhum registro na amostra.</td></tr>{% endfor %}</tbody></table></div><div class="flex items-center justify-between border-t bg-slate-50 px-4 py-3 text-sm"><span>Página {{ page }}</span><div class="flex gap-2">{% if page > 1 %}<button hx-get="{% url 'marketplace:dataset_preview' dataset.slug %}?page={{ page|add:'-1' }}&q={{ query|urlencode }}" hx-target="#preview-container" class="rounded border bg-white px-3 py-1.5">Anterior</button>{% endif %}{% if has_next %}<button hx-get="{% url 'marketplace:dataset_preview' dataset.slug %}?page={{ page|add:'1' }}&q={{ query|urlencode }}" hx-target="#preview-container" class="rounded border bg-white px-3 py-1.5">Próxima</button>{% endif %}</div></div></div>
