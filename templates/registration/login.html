{% extends "base.html" %}{% block title %}Entrar — Datasul{% endblock %}{% block content %}<div class="mx-auto max-w-md px-4 py-14"><div class="rounded-2xl border bg-white p-8 shadow-xl"><h1 class="text-2xl font-black">Acesse sua conta</h1><p class="mt-1 text-sm text-slate-500">Entre para comprar e baixar seus datasets.</p><form method="post" class="mt-6 space-y-4">{% csrf_token %}{% if form.non_field_errors %}<div class="rounded bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>{% endif %}<div><label for="id_username" class="text-sm font-bold">Usuário</label><input id="id_username" name="username" autocomplete="username" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></div><div><label for="id_password" class="text-sm font-bold">Senha</label><input id="id_password" name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></div><input type="hidden" name="next" value="{{ next }}"><button class="w-full rounded-lg bg-blue-700 py-3 font-bold text-white">Entrar</button></form><p class="mt-5 text-center text-sm text-slate-500">Ainda não tem conta? <a href="{% url 'signup' %}" class="font-bold text-blue-700">Cadastre-se</a></p></div></div>{% endblock %}
